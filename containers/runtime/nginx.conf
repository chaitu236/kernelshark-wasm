map $http_accept_encoding $ks_accepts_brotli {
    "~*br\s*;\s*q=0(?:\.0*)?(?:\s*,|$)" 0;
    "~*(?:^|,)\s*br(?:\s*[;,]|$)" 1;
    default 0;
}

map "$uri:$ks_accepts_brotli" $ks_wasm_brotli_suffix {
    default "";
    "~^/assets/[0-9a-f]{64}/kernelshark\.wasm:1$" ".br";
}

map $ks_wasm_brotli_suffix $ks_wasm_content_encoding {
    default "";
    ".br" "br";
}

map $uri $ks_cache_control {
    default "no-cache";
    "~^/assets/[0-9a-f]{64}/" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index kernelshark.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $ks_cache_control always;
    add_header Content-Encoding $ks_wasm_content_encoding always;
    add_header Vary "Accept-Encoding" always;

    gzip off;
    gzip_static on;
    gzip_vary off;

    location = / {
        try_files /kernelshark.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ "^/assets/[0-9a-f]{64}/kernelshark\.wasm$" {
        types {}
        default_type application/wasm;
        try_files $uri$ks_wasm_brotli_suffix $uri =404;
    }

    location ~ "^/assets/[0-9a-f]{64}/" {
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}