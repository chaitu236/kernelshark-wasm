name: PR Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Pull matching toolchain image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image_tag=$(./build_container.sh --print-image-tag)
          builder_image="ghcr.io/ni/kernelshark-wasm-builder:$image_tag"
          echo "Using toolchain image: $builder_image"
          registry_config=$(mktemp -d)
          trap 'rm -rf "$registry_config"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker --config "$registry_config" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          if ! docker --config "$registry_config" pull --platform linux/amd64 "$builder_image"; then
            echo "::error::Cannot pull $builder_image. A maintainer must build and publish this image using the default Dockerfile build arguments for linux/amd64. Check the repository's Actions read access to the package if the image already exists."
            exit 1
          fi
          printf 'BUILDER_IMAGE=%s\n' "$builder_image" >> "$GITHUB_ENV"

      - name: Build WASM application
        run: ./build.sh

      - name: Upload browser artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kernelshark-wasm
          path: out/wasm-release/dist/
          if-no-files-found: error
          retention-days: 3

  browser-tests:
    name: Browser Tests
    needs: wasm-build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    defaults:
      run:
        working-directory: tests
    env:
      CI: true

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download browser artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: kernelshark-wasm
          path: out/wasm-release/dist/

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run browser tests
        run: npm test

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-test-results
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: warn
          retention-days: 3
