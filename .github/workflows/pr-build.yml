name: PR Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-26.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build toolchain image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: containers/builder/Dockerfile
          load: true
          tags: kernelshark-wasm-builder:latest
          cache-from: type=gha,scope=kernelshark-wasm-builder
          cache-to: type=gha,scope=kernelshark-wasm-builder,mode=max,ignore-error=true

      - name: Build WASM application
        run: ./build.sh

      - name: Upload browser artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kernelshark-wasm
          path: out/wasm-release/dist/
          if-no-files-found: error
          retention-days: 3
